# What a lab stage's founding adds to the one programs published: `live.sh`
# puts this after it, in the stage's programs/ beside the files, and `kit up`
# fills each file name with its path there.

# The program with its view and its describe module packed into it. The
# params are its markets' past: a week of every market's minutes
# (`crates/app/trade/examples/history.rs`).
[[programs]]
id = "trade"
code = "trade.wasm"
params = "trade.params"

# The high scores of the arcade's games, with its view packed in; it takes
# no params.
[[programs]]
id = "arcade"
code = "arcade.wasm"

# The browser: a view with no program behind it, listed by the registry and
# never admitted, as kit's explorer is. It declares `web`, so an https link
# another view opens comes to it.
[[views]]
name = "browser"
code = "browser_view.wasm"

# Huddle: a view with no program, which checks the person's camera and
# microphone (the app's `av` feature captures; without it the view says so).
[[views]]
name = "huddle"
code = "huddle_view.wasm"

# A kit stage meters nothing without limits. These are the ones core's README
# gives: the program is checked against a host that counts.
[limits]
fuel = 1000000000
memory_bytes = 268435456
