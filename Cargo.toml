# modules-lab — experiments written against the modules SDK, out of tree.
#
# A crate here keeps the shape of programs' `crates/app/*` (a view is a cdylib
# for wasm32-unknown-unknown on `view`), so one that earns its place moves
# over as it is.

[workspace]
resolver = "2"
members = ["crates/app/trade", "crates/app/trade-view", "crates/app/arcade", "crates/app/arcade-view", "crates/app/browser-view", "crates/app/live-echo", "crates/app/live-echo-view"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
# ---- sdk-line: programs @ 2bb873d1 (programs `fix/live-sync`: dev 7940db98 with the live work, on core dev 18477333b and gpui-pre 0bf28c84; WIRE_ID 733cb31a), the live lane's final head. The app refuses
# a view built against another wire, so this moves when the app's pin moves.
view = { git = "https://github.com/ducktape-industries/programs", rev = "2bb873d1b33d5d594c7833f73c40d92e75b7d70d" }
# What a program is written against: the kernel ABI (a copy of core's, never
# to drift from it), the program SDK and its mock host, the tables, and the
# describe module.
abi = { git = "https://github.com/ducktape-industries/programs", rev = "2bb873d1b33d5d594c7833f73c40d92e75b7d70d" }
program = { git = "https://github.com/ducktape-industries/programs", rev = "2bb873d1b33d5d594c7833f73c40d92e75b7d70d" }
store = { git = "https://github.com/ducktape-industries/programs", rev = "2bb873d1b33d5d594c7833f73c40d92e75b7d70d" }
describe = { git = "https://github.com/ducktape-industries/programs", rev = "2bb873d1b33d5d594c7833f73c40d92e75b7d70d" }
# The op that gives a key its account: what a live stage's seed sends first
# (`crates/app/trade/examples/seed.rs`), and the profiles arcade-view reads
# names from.
identity = { git = "https://github.com/ducktape-industries/programs", rev = "2bb873d1b33d5d594c7833f73c40d92e75b7d70d" }
# What packs a program with its view and its describe module, as a founding
# takes it (`crates/app/trade/examples/pack.rs`, which `live/live.sh` runs).
founding = { git = "https://github.com/ducktape-industries/programs", rev = "2bb873d1b33d5d594c7833f73c40d92e75b7d70d" }
# `canvas().rect` takes a `Bounds` made with gpui's `point` and `size`, which
# the SDK does not re-export.
# The rev is the one modules names.
gpui = { package = "gpui-pre", git = "https://github.com/ducktape-industries/gpui-pre", rev = "0bf28c84fce24fcb40c8f324af8a71fb25452c39", default-features = false }

# ---- here
trade = { path = "crates/app/trade" }
arcade = { path = "crates/app/arcade" }
live-echo = { path = "crates/app/live-echo" }

# ---- external
borsh = { version = "1", default-features = false, features = ["derive", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the address field reads a page's host as its engine does (the URL
# standard); gpui links it already
url = "2"

# proc-macro and build-script crates are compiled once and then run for every
# unit below them — unoptimized they dominate a debug build.
[profile.dev.build-override]
opt-level = 2

# The profile modules ships its views from: size for the shared code, speed
# for the view and the SDK crates only a view links (a view's redraw is fuel
# per instruction).
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package.trade-view]
opt-level = 3
[profile.release.package.arcade-view]
opt-level = 3
[profile.release.package.browser-view]
opt-level = 3
[profile.release.package.live-echo-view]
opt-level = 3
[profile.release.package.view]
opt-level = 3
[profile.release.package.view-wire]
opt-level = 3
[profile.release.package.gpui-pre]
opt-level = 3

# The patches modules' root carries: the fork's MessagePack and scheduler
# crates. A dependency's `[patch]` does not reach its dependents, so they are
# repeated here, at the same rev.
[patch.crates-io]
rmp-serde = { git = "https://github.com/ducktape-industries/gpui-pre", rev = "0bf28c84fce24fcb40c8f324af8a71fb25452c39" }
gpui-pre-scheduler = { git = "https://github.com/ducktape-industries/gpui-pre", rev = "0bf28c84fce24fcb40c8f324af8a71fb25452c39" }

# The SDK's fake node (`view`'s `rig`) links programs' blobs crate, which links
# core's `blob` and with it core's abi: one abi in the graph, the programs
# copy, as the app patches it.
[patch."https://github.com/ducktape-industries/ducktape"]
abi = { git = "https://github.com/ducktape-industries/programs", rev = "2bb873d1b33d5d594c7833f73c40d92e75b7d70d", package = "abi" }
