# modules-lab — experiments written against the modules SDK, out of tree.
#
# A crate here keeps the shape of modules' `crates/app/*` (a view is a cdylib
# for wasm32-unknown-unknown on `view`), so one that earns its
# place moves over as it is.

[workspace]
resolver = "2"
members = ["crates/app/trade", "crates/app/trade-view", "crates/app/arcade", "crates/app/arcade-view", "crates/app/browser-view", "crates/app/huddle-view"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
# ---- sdk-line: programs @ cb747130 (poc/huddle-float: #363 dd4d1d85 plus the camera and microphone pieces and the float; WIRE_ID 4a84b2248143cc5b), the rev the app pins. The app refuses
# a view built against another wire, so this moves when the app's pin moves.
view = { git = "https://github.com/ducktape-industries/programs", rev = "cb747130153493e55a7acbee8fbe4fa74cde7e1a" }
# What a program is written against: the kernel ABI (a copy of core's, never
# to drift from it), the program SDK and its mock host, the query derive, the
# tables, and the describe module.
abi = { git = "https://github.com/ducktape-industries/programs", rev = "cb747130153493e55a7acbee8fbe4fa74cde7e1a" }
program = { git = "https://github.com/ducktape-industries/programs", rev = "cb747130153493e55a7acbee8fbe4fa74cde7e1a" }
store = { git = "https://github.com/ducktape-industries/programs", rev = "cb747130153493e55a7acbee8fbe4fa74cde7e1a" }
describe = { git = "https://github.com/ducktape-industries/programs", rev = "cb747130153493e55a7acbee8fbe4fa74cde7e1a" }
# The op that gives a key its account: what a live stage's seed sends first
# (`crates/app/trade/examples/seed.rs`). No program or view here links it.
identity = { git = "https://github.com/ducktape-industries/programs", rev = "cb747130153493e55a7acbee8fbe4fa74cde7e1a" }
# `canvas().rect` takes a `Bounds` made with gpui's `point` and `size`, which
# the SDK does not re-export.
# The rev is the one programs names.
gpui = { package = "gpui-pre", git = "https://github.com/ducktape-industries/gpui-pre", rev = "b38e8b8feec037f15da484f7f703983ae4f8f0de", default-features = false }

# ---- here
trade = { path = "crates/app/trade" }
arcade = { path = "crates/app/arcade" }

# ---- external
borsh = { version = "1", default-features = false, features = ["derive", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the address field reads a page's host as its engine does (the URL
# standard); gpui links it already
url = "2"

# proc-macro and build-script crates are compiled once and then run for every
# unit below them — unoptimized they dominate a debug build.
[profile.dev.build-override]
opt-level = 2

# The profile modules ships its views from: size for the shared code, speed
# for the view and the SDK crates only a view links (a view's redraw is fuel
# per instruction).
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package.trade-view]
opt-level = 3
[profile.release.package.arcade-view]
opt-level = 3
[profile.release.package.browser-view]
opt-level = 3
[profile.release.package.huddle-view]
opt-level = 3
[profile.release.package.view]
opt-level = 3
[profile.release.package.view-wire]
opt-level = 3
[profile.release.package.gpui-pre]
opt-level = 3

# The patches modules' root carries: the fork's MessagePack and scheduler
# crates. A dependency's `[patch]` does not reach its dependents, so they are
# repeated here, at the same rev.
[patch.crates-io]
rmp-serde = { git = "https://github.com/ducktape-industries/gpui-pre", rev = "b38e8b8feec037f15da484f7f703983ae4f8f0de" }
gpui-pre-scheduler = { git = "https://github.com/ducktape-industries/gpui-pre", rev = "b38e8b8feec037f15da484f7f703983ae4f8f0de" }

# The SDK's fake node (`view`'s `live`) links programs' blobs crate, which links
# core's `blob` and with it core's abi: one abi in the graph, the programs
# copy, as the app patches it.
[patch."https://github.com/ducktape-industries/ducktape"]
abi = { git = "https://github.com/ducktape-industries/programs", rev = "cb747130153493e55a7acbee8fbe4fa74cde7e1a", package = "abi" }
