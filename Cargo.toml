# modules-lab — experiments written against the modules SDK, out of tree.
#
# A crate here keeps the shape of programs' `crates/app/*` (a view is a cdylib
# for wasm32-unknown-unknown on `view`), so one that earns its place moves
# over as it is.

[workspace]
resolver = "2"
members = ["crates/app/trade", "crates/app/trade-view", "crates/app/arcade", "crates/app/arcade-view", "crates/app/huddle", "crates/app/browser-view", "crates/app/huddle-view", "crates/bots/tetris-bot"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
# ---- sdk-line: programs @ 83c9cfa1 (programs `dev`: the call's pieces and a ring's notice, #430, over
# dev 67d3a0bd with file.pick, #431; on core dev 8a0151a41 and gpui-pre ef025a32; WIRE_ID a62f7a5b7637eb93).
# The views here are built at the rev the app pins, so this moves when the app's pin moves.
view = { git = "https://github.com/ducktape-industries/programs", rev = "83c9cfa1787ff4c579c296f015c4abee83b65181" }
# What a program is written against: the kernel ABI (a copy of core's, never
# to drift from it), the program SDK and its mock host, the tables, and the
# describe module.
abi = { git = "https://github.com/ducktape-industries/programs", rev = "83c9cfa1787ff4c579c296f015c4abee83b65181" }
program = { git = "https://github.com/ducktape-industries/programs", rev = "83c9cfa1787ff4c579c296f015c4abee83b65181" }
store = { git = "https://github.com/ducktape-industries/programs", rev = "83c9cfa1787ff4c579c296f015c4abee83b65181" }
describe = { git = "https://github.com/ducktape-industries/programs", rev = "83c9cfa1787ff4c579c296f015c4abee83b65181" }
# The op that gives a key its account: what a live stage's seed sends first
# (`crates/app/trade/examples/seed.rs`), and the profiles arcade-view reads
# names from.
identity = { git = "https://github.com/ducktape-industries/programs", rev = "83c9cfa1787ff4c579c296f015c4abee83b65181" }
# What packs a program with its view and its describe module, as a founding
# takes it (`crates/app/trade/examples/pack.rs`, which `live/live.sh` runs).
founding = { git = "https://github.com/ducktape-industries/programs", rev = "83c9cfa1787ff4c579c296f015c4abee83b65181" }
# The chain id a live track's namespace starts with (`ChainId::of`), as the
# app names it: what tetris-bot names the versus room by.
ducklink = { git = "https://github.com/ducktape-industries/programs", rev = "83c9cfa1787ff4c579c296f015c4abee83b65181" }
# `canvas().rect` takes a `Bounds` made with gpui's `point` and `size`, which
# the SDK does not re-export.
# The rev is the one modules names.
gpui = { package = "gpui-pre", git = "https://github.com/ducktape-industries/gpui-pre", rev = "ef025a323b35dae1f64b9de0304f15aff020ad46", default-features = false }

# ---- here
trade = { path = "crates/app/trade" }
arcade = { path = "crates/app/arcade" }
huddle = { path = "crates/app/huddle" }

# ---- external
borsh = { version = "1", default-features = false, features = ["derive", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the address field reads a page's host as its engine does (the URL
# standard); gpui links it already
url = "2"

# proc-macro and build-script crates are compiled once and then run for every
# unit below them — unoptimized they dominate a debug build.
[profile.dev.build-override]
opt-level = 2

# The profile modules ships its views from: size for the shared code, speed
# for the view and the SDK crates only a view links (a view's redraw is fuel
# per instruction).
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package.trade-view]
opt-level = 3
[profile.release.package.arcade-view]
opt-level = 3
[profile.release.package.browser-view]
opt-level = 3
[profile.release.package.huddle-view]
opt-level = 3
[profile.release.package.view]
opt-level = 3
[profile.release.package.view-wire]
opt-level = 3
[profile.release.package.gpui-pre]
opt-level = 3

# The patches modules' root carries: the fork's MessagePack and scheduler
# crates. A dependency's `[patch]` does not reach its dependents, so they are
# repeated here, at the same rev.
[patch.crates-io]
rmp-serde = { git = "https://github.com/ducktape-industries/gpui-pre", rev = "ef025a323b35dae1f64b9de0304f15aff020ad46" }
gpui-pre-scheduler = { git = "https://github.com/ducktape-industries/gpui-pre", rev = "ef025a323b35dae1f64b9de0304f15aff020ad46" }

# The SDK's fake node (`view`'s `rig`) links programs' blobs crate, which links
# core's `blob` and with it core's abi: one abi in the graph, the programs
# copy, as the app patches it.
[patch."https://github.com/ducktape-industries/ducktape"]
abi = { git = "https://github.com/ducktape-industries/programs", rev = "83c9cfa1787ff4c579c296f015c4abee83b65181", package = "abi" }
