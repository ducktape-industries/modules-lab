# modules-lab — experiments written against the modules SDK, out of tree.
#
# A crate here keeps the shape of modules' `crates/app/*` (a view is a cdylib
# for wasm32-unknown-unknown on `ducktape-view-guest`), so one that earns its
# place moves over as it is.

[workspace]
resolver = "2"
members = ["crates/app/trade", "crates/app/trade-view", "crates/app/arcade", "crates/app/arcade-view", "crates/app/browser-view"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
# ---- sdk-line: modules poc/browser @ 128f015d (the web piece on dev 47cf81bc, WIRE_ID 970ebc24; the fork at da49e2b0, taffy 0.14.0), the rev the app pins. The app refuses
# a view built against another wire, so this moves when the app's pin moves.
ducktape-view-guest = { git = "https://github.com/ducktape-industries/modules", rev = "128f015dcd5b5e5fb9f38a62cdbb944ef71350f8" }
# What a program is written against: the kernel ABI (a copy of core's, never
# to drift from it), the guest and its mock host, the query derive, the
# tables, and the describe module.
abi = { git = "https://github.com/ducktape-industries/modules", rev = "128f015dcd5b5e5fb9f38a62cdbb944ef71350f8" }
guest = { git = "https://github.com/ducktape-industries/modules", rev = "128f015dcd5b5e5fb9f38a62cdbb944ef71350f8" }
program = { git = "https://github.com/ducktape-industries/modules", rev = "128f015dcd5b5e5fb9f38a62cdbb944ef71350f8" }
store = { git = "https://github.com/ducktape-industries/modules", rev = "128f015dcd5b5e5fb9f38a62cdbb944ef71350f8" }
describe = { git = "https://github.com/ducktape-industries/modules", rev = "128f015dcd5b5e5fb9f38a62cdbb944ef71350f8" }
# The op that gives a key its account: what a live stage's seed sends first
# (`crates/app/trade/examples/seed.rs`). No program or view here links it.
identity = { git = "https://github.com/ducktape-industries/modules", rev = "128f015dcd5b5e5fb9f38a62cdbb944ef71350f8" }
# `canvas().rect` takes a `Bounds` made with gpui's `point` and `size`, which
# the SDK does not re-export.
# The rev is the one modules names.
gpui = { package = "gpui-pre", git = "https://github.com/ducktape-industries/gpui-pre", rev = "da49e2b089cb5bf8f36fef940cf5c0b94df92138", default-features = false }

# ---- here
trade = { path = "crates/app/trade" }
arcade = { path = "crates/app/arcade" }

# ---- external
borsh = { version = "1", default-features = false, features = ["derive", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# proc-macro and build-script crates are compiled once and then run for every
# unit below them — unoptimized they dominate a debug build.
[profile.dev.build-override]
opt-level = 2

# The profile modules ships its views from: size for the shared code, speed
# for the view and the SDK crates only a view links (a view's redraw is fuel
# per instruction).
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package.trade-view]
opt-level = 3
[profile.release.package.arcade-view]
opt-level = 3
[profile.release.package.browser-view]
opt-level = 3
[profile.release.package.ducktape-view-guest]
opt-level = 3
[profile.release.package.view-wire]
opt-level = 3
[profile.release.package.gpui-pre]
opt-level = 3

# The patches modules' root carries: the fork's MessagePack, scheduler and
# logging crates. A dependency's `[patch]` does not reach its dependents, so
# they are repeated here, at the same rev.
[patch.crates-io]
rmp-serde = { git = "https://github.com/ducktape-industries/gpui-pre", rev = "da49e2b089cb5bf8f36fef940cf5c0b94df92138" }
gpui-pre-scheduler = { git = "https://github.com/ducktape-industries/gpui-pre", rev = "da49e2b089cb5bf8f36fef940cf5c0b94df92138" }
gpui-pre-zlog = { git = "https://github.com/ducktape-industries/gpui-pre", rev = "da49e2b089cb5bf8f36fef940cf5c0b94df92138" }
