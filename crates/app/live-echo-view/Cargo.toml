[package]
name = "live-echo-view"
edition.workspace = true
version.workspace = true
publish = false

# A Rust-authored view, exported as a dynamically loaded wasm module by
# `export_view!`; the rlib is what its native tests link.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
view.workspace = true
serde.workspace = true
# the program's types, linked with `program` off: the op that opens the lobby
live-echo.workspace = true
# the refusal codes (`code::UNEXPECTED_REPLY`)
program.workspace = true

[dev-dependencies]
# a line's body, as the host carries it
borsh.workspace = true
