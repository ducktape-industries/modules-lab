[package]
name = "huddle-view"
edition.workspace = true
version.workspace = true
publish = false

# A view-only module: no program. Exported as a dynamically loaded wasm
# module by `export_view!`; the rlib is what its native tests link.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
view.workspace = true
# `relative` for the view's line height, which the SDK does not re-export
gpui.workspace = true
serde.workspace = true

[dev-dependencies]
# `examples/live.rs`: the view in the real app over the fake node
view = { workspace = true, features = ["rig"] }
