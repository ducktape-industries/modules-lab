[package]
name = "browser-view"
edition.workspace = true
version.workspace = true
publish = false

# A view-only module: no program. Exported as a dynamically loaded wasm
# module by `export_view!`; the rlib is what its native tests link.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ducktape-view-guest.workspace = true
gpui.workspace = true
serde.workspace = true
url.workspace = true

[dev-dependencies]
# `examples/live.rs`: the view in the real app over the fake node
ducktape-view-guest = { workspace = true, features = ["rig"] }
