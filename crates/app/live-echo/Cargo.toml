[package]
name = "live-echo"
version.workspace = true
edition.workspace = true
publish = false

# The types and the rule are always built; the view links them with
# `program` off. `program` adds the wasm exports (`program::export!`), which
# only the program's own wasm build turns on.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
program = []
# `describe` makes this crate's wasm build the `ducktape.describe` module:
# the `describe` export alone, no module, no imports.
describe = []

[dependencies]
borsh = { workspace = true }
describe = { workspace = true }
program = { workspace = true }
