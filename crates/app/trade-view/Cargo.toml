[package]
name = "trade-view"
edition.workspace = true
version.workspace = true
publish = false

# A Rust-authored view, exported as a dynamically loaded wasm module by
# `export_view!`; the rlib is what its native tests link.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
view.workspace = true
gpui.workspace = true
serde.workspace = true
# the program's types and rules, linked with `program` off
trade.workspace = true
# `Reads`: which tables a query reads, asked of each block's change
program.workspace = true
# `PageRequest`: the page a list asks for
store.workspace = true

[dev-dependencies]
# a test writes the frame it drew as the JSON the app's `--render-tree` reads
serde_json.workspace = true
